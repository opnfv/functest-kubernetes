---
tiers:
  - name: smoke
    description: >-
      A set of conformance tests integrated from kubernetes project.
    testcases:
      - case_name: xrally_kubernetes
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          All in one tasks for checking basic functionality of
          Kubernetes cluster.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: xrally_kubernetes
      - case_name: k8s_conformance
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          Conformance Tests are expect to pass on any Kubernetes
          cluster, this tests are necessary demonstrate conformance
          of the Kubernetes deployment.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[Conformance\]
              skip: \[Serial\]|\[Disruptive\]|NoExecuteTaintManager
      - case_name: sig_api_machinery
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-api-machinery testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[sig-api-machinery\]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Serial\\]|\\[Conformance\\]|\
                \\[Feature:CoordinatedLeaderElection\\]|\
                \\[Feature:CrossNamespacePodAffinity\\]|\
                \\[Feature:CustomResourceValidationExpressions\\]|\
                \\[Feature:DynamicResourceAllocation\\]|\
                \\[Feature:MutatingAdmissionPolicy\\]|\
                \\[Feature:StorageVersionAPI\\]|\
                \\[Feature:WatchList\\]|\
                \\[FeatureGate:StorageVersionMigrator\\]|\
                \\[FeatureGate:VolumeAttributesClass\\]|\
                \\[FeatureGate:WatchList\\]"
      - case_name: sig_api_machinery_serial
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-api-machinery testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            ginkgo:
              focus: \[sig-api-machinery\].*\[Serial\]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Conformance\\]|\
                \\[Feature:CoordinatedLeaderElection\\]|\
                \\[Feature:CrossNamespacePodAffinity]|\
                \\[Feature:CustomResourceValidationExpressions\\]|\
                \\[Feature:DynamicResourceAllocation\\]|\
                \\[Feature:StorageVersionAPI\\]|\
                \\[Feature:WatchList\\]|\
                \\[FeatureGate:StorageVersionMigrator\\]|\
                \\[FeatureGate:VolumeAttributesClass\\]|\
                \\[FeatureGate:WatchList\\]"
      - case_name: sig_apps
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-apps testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[sig-apps]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Serial\\]|\\[Conformance\\]|\
                \\[Feature:DaemonSetUpdateSurge\\]|\
                \\[Feature:IndexedJob\\]|\
                \\[Feature:StatefulSet\\]|\
                \\[Feature:StatefulSetAutoDeletePVC\\]|\
                \\[Feature:StatefulUpgrade\\]|\
                \\[Feature:SuspendJob\\]"
      - case_name: sig_apps_serial
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-apps testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            ginkgo:
              focus: \[sig-apps].*\[Serial\]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Conformance\\]|\
                \\[Feature:DaemonSetUpdateSurge\\]|\
                \\[Feature:IndexedJob\\]|\
                \\[Feature:StatefulSet\\]|\
                \\[Feature:StatefulUpgrade\\]|\
                \\[Feature:SuspendJob\\]"
      - case_name: sig_auth
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-auth testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
          features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[sig-auth\]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Serial\\]|\\[Conformance\\]|\
                \\[Feature:ClusterTrustBundle\\]|\
                \\[Feature:PodSecurityPolicy\\]|\
                \\[Feature:BoundServiceAccountTokenVolume\\]|\
                \\[FeatureGate:ClusterTrustBundle\\]"
      - case_name: sig_instrumentation
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-instrumentation testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[sig-instrumentation\]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Serial\\]|\\[Conformance\\]|\\[Feature:Elasticsearch\\]|\
                \\[Feature:StackdriverAcceleratorMonitoring\\]|\
                \\[Feature:StackdriverCustomMetrics\\]|\
                \\[Feature:StackdriverExternalMetrics\\]|\
                \\[Feature:StackdriverMetadataAgent\\]|\
                \\[Feature:StackdriverMonitoring\\]"
      - case_name: sig_network
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-network testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[sig-network\]
              # Skip the "Conntrack should clear conntrack entries when a UDP
              # service is deleted" spec (added in Kubernetes master by
              # PR #141371). It requires the kube-proxy fix that clears the
              # conntrack entries of a deleted UDP Service, and that fix only
              # exists in Kubernetes >= v1.38.0-alpha.1. This CI runs a
              # v1.37 cluster (kindest/node:v1.37.0) against the v1.38.0-alpha.2
              # e2e binaries: the stale conntrack entry keeps DNAT-ing the UDP
              # traffic to the deleted service, so the client pod never stops
              # receiving traffic and the spec fails after 60s.
              # Remove this skip once the CI runs an image with the fix.
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Serial\\]|\\[Conformance\\]|\
                \\[Feature:Example\\]|\
                \\[Feature:Ingress\\]|\
                \\[Feature:IPv6DualStack\\]|\
                \\[Feature:kubemci\\]|\
                \\[Feature:KubeProxyDaemonSetMigration\\]|\
                \\[Feature:KubeProxyDaemonSetUpgrade\\]|\
                \\[Feature:NEG\\]|\
                \\[Feature:Networking-IPv6\\]|\
                \\[Feature:NetworkPolicy\\]|\
                \\[Feature:PerformanceDNS\\]|\
                \\[Feature:ProxyTerminatingEndpoints\\]|\
                \\[Feature:RelaxedDNSSearchValidation\\]|\
                \\[Feature:SCTP\\]|\
                \\[Feature:SCTPConnectivity\\]|\
                \\[Feature:ServiceCIDRs\\]|\
                DNS configMap nameserver|\
                load.balancer|LoadBalancer|\
                Network.should.set.TCP.CLOSE_WAIT.timeout|\
                Conntrack.*clear.conntrack.entries.when.a.UDP.service.is.deleted"
      - case_name: sig_node
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-node testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[sig-node]
              # Skip the "should not run liveness or readiness probes before
              # startup probe succeeds after container restart" spec (added in
              # Kubernetes master by PR #141342). It requires the kubelet fix
              # that re-gates the liveness and readiness probes until a
              # replacement container passes its own startup probe, and that
              # fix only exists in Kubernetes >= v1.38.0-alpha.1. This CI runs
              # a v1.37 cluster (kindest/node:v1.37.0) against the
              # v1.38.0-alpha.2 e2e binaries: the replacement container
              # inherits "started=true" from the previous one, so the liveness
              # and readiness probes run on it before its startup probe
              # succeeds, and the spec fails.
              # Remove this skip once the CI runs an image with the fix.
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Serial\\]|\\[Conformance\\]|\
                \\[Feature:DynamicResourceAllocation\\]|\
                \\[Feature:ExperimentalResourceUsageTracking\\]|\
                \\[Feature:RelaxedEnvironmentVariableValidation\\]|\
                \\[Feature:GRPCContainerProbe\\]|\
                \\[Feature:GPUUpgrade\\]|\
                \\[Feature:KubeletCredentialProviders\\]|\
                \\[Feature:KubeletFineGrainedAuthz\\]|\
                \\[Feature:NodeLogQuery\\]|\
                \\[Feature:PodGarbageCollector\\]|\
                \\[Feature:PodLifecycleSleepAction\\]|\
                \\[Feature:PodLifecycleSleepActionAllowZero\\]|\
                \\[Feature:PodLogsQuerySplitStreams\\]|\
                \\[Feature:RegularResourceUsageTracking\\]|\
                \\[Feature:SidecarContainers\\]|\
                \\[Feature:UserNamespacesPodSecurityStandards\\]|\
                \\[Feature:UserNamespacesSupport\\]|\
                \\[Feature:UserNamespacesStatelessPodsSupport\\]|\
                \\[FeatureGate:DRADeviceTaints\\]|\
                \\[FeatureGate:InPlacePodVerticalScaling\\]|\
                \\[NodeFeature:DownwardAPIHugePages\\]|\
                \\[NodeFeature:RuntimeHandler\\]|\
                should.not.run.liveness.or.readiness.probes.before.startup.probe.succeeds.after.container.restart"
      - case_name: sig_scheduling_serial
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-network testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: 'k8-*'
        run:
          name: e2e_testing
          args:
            ginkgo:
              focus: \[sig-scheduling\].*\[Serial\]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Conformance\\]|\
                \\[Feature:GPUDevicePlugin\\]|\
                \\[Feature:Recreate\\]|\
                \\[Feature:SchedulerAsyncPreemption\\]"
      - case_name: sig_storage
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-storage testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            nodes: 10
            ginkgo:
              focus: \[sig-storage\]
              # Skip the "should cleanup VolumeAttachment properly" spec
              # (updated in Kubernetes master by PR #141522). It requires the
              # kubelet fix that updates the actual state of world when the
              # CSIDriver attachRequired flag changes, and that fix only exists
              # in Kubernetes >= v1.38.0-alpha.2. This CI runs a v1.37 cluster
              # (kindest/node:v1.37.0) against the v1.38.0-alpha.2 e2e binaries:
              # the kubelet keeps reporting the volume as requiring controller
              # attachment in Node.Status.VolumesInUse, so the attach/detach
              # controller never deletes the VolumeAttachment and the spec
              # fails after 7 minutes.
              # Remove this skip once the CI runs an image with the fix.
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Conformance\\]|\\[Driver:.+\\]|\
                \\[Feature:CSIVolumeHealth\\]|\
                \\[Feature:ExpandInUsePersistentVolumes\\]|\
                \\[Feature:Flexvolumes\\]|\
                \\[Feature:GKELocalSSD\\]|\
                \\[Feature:VolumeSnapshotDataSource\\]|\
                \\[Feature:Flexvolumes\\]|\
                \\[Feature:RecoverVolumeExpansionFailure\\]|\
                \\[Feature:SELinux\\]|\
                \\[Feature:VolumeAttributesClass\\]|\
                \\[Feature:vsphere\\]|\
                \\[Feature:Volumes\\]|\
                \\[Feature:Windows\\]|\
                \\[FeatureGate:CSIVolumeHealth\\]|\
                \\[FeatureGate:MutableCSINodeAllocatableCount\\]|\
                \\[FeatureGate:VolumeAttributesClass\\]|\
                \\[NodeFeature:EphemeralStorage\\]|\
                PersistentVolumes.NFS|\
                should provision storage with different parameters|\
                should not cause race condition when used for git_repo|\
                should.cleanup.VolumeAttachment.properly"
      - case_name: sig_storage_serial
        project_name: functest
        criteria: 100
        blocking: false
        description: >-
          It runs the remaining sig-storage testing excluding
          the label Conformance (part of k8s_conformance) and a few features.
        dependencies:
          - DEPLOY_SCENARIO: "k8-*"
        run:
          name: e2e_testing
          args:
            ginkgo:
              focus: \[sig-storage\].*\[Serial\]
              skip: "\\[Disruptive\\]|\\[Flaky\\]|\\[Alpha\\]|\
                \\[Conformance\\]|\\[Driver:.+\\]|\
                \\[Feature:CSIVolumeHealth\\]|\
                \\[Feature:ExpandInUsePersistentVolumes\\]|\
                \\[Feature:Flexvolumes\\]|\
                \\[Feature:GKELocalSSD\\]|\
                \\[Feature:VolumeSnapshotDataSource\\]|\
                \\[Feature:Flexvolumes\\]|\
                \\[Feature:RecoverVolumeExpansionFailure\\]|\
                \\[Feature:SELinux\\]|\
                \\[Feature:VolumeAttributesClass\\]|\
                \\[Feature:vsphere\\]|\
                \\[Feature:Volumes\\]|\
                \\[Feature:Windows\\]|\
                \\[FeatureGate:CSIVolumeHealth\\]|\
                \\[FeatureGate:MutableCSINodeAllocatableCount\\]|\
                \\[FeatureGate:VolumeAttributesClass\\]|\
                \\[NodeFeature:EphemeralStorage\\]|\
                PersistentVolumes.NFS|\
                should provision storage with different parameters|\
                should not cause race condition when used for git_repo|\
                should.cleanup.VolumeAttachment.properly"
